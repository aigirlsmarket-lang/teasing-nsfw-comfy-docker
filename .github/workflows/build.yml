name: Build & Push teasing-nsfw-comfy image

# Триггеры:
#   - push в main (когда меняем Dockerfile / bake_custom_nodes.sh)
#   - manual workflow_dispatch (для перебилда без commit'а)
on:
  push:
    branches: [main]
    paths:
      - 'Dockerfile'
      - 'bake_custom_nodes.sh'
      - '.github/workflows/build.yml'
  workflow_dispatch:

env:
  IMAGE_NAME: teasing-nsfw-comfy

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Free runner ~14 GB free disk. Чистим лишнее.
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          sudo rm -rf /usr/local/lib/android
          df -h

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        run: |
          SHA_SHORT=$(echo "${{ github.sha }}" | cut -c1-7)
          GIT_TAG=$(git tag --points-at HEAD | head -1)
          if [ -n "$GIT_TAG" ]; then
            echo "tags=${{ secrets.DOCKERHUB_USERNAME }}/${IMAGE_NAME}:${GIT_TAG},${{ secrets.DOCKERHUB_USERNAME }}/${IMAGE_NAME}:latest,${{ secrets.DOCKERHUB_USERNAME }}/${IMAGE_NAME}:sha-${SHA_SHORT}" >> $GITHUB_OUTPUT
          else
            echo "tags=${{ secrets.DOCKERHUB_USERNAME }}/${IMAGE_NAME}:latest,${{ secrets.DOCKERHUB_USERNAME }}/${IMAGE_NAME}:sha-${SHA_SHORT}" >> $GITHUB_OUTPUT
          fi

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      - name: Image summary
        run: |
          echo "### Image pushed to DockerHub" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Tags:" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" | tr ',' '\n' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
